<!doctype html>
<html lang="ru-RU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <script type="module" crossorigin src="./assets/main-Jq7GL_tz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BFkQkzC4.css">
  </head>
  <body>
    <section class="login">
      <div class="login__main">
        <form class="login__form">
          <div class="login__form-header">
            <img
              class="login__form-logo"
              src="./logo.svg"
              alt=""
              width="176"
              height="44"
              loading="lazy"
            />
            <h1 class="login__form-title">Client Zone Sign In</h1>
          </div>
          <div class="login__form-body">
            <div class="login__input input">
              <label class="input__label" for="input-email"> Email </label>
              <input
                class="input__field"
                type="text"
                id="input-email"
                placeholder="Enter Your Email"
              />
            </div>
            <div class="login__input input">
              <label class="input__label" for="input-password">
                Password
              </label>
              <input
                class="input__field"
                type="text"
                id="input-password"
                placeholder="Enter Your Password"
              />
            </div>
            <div class="login__actions">
              <label class="login__checkbox checkbox">
                <input
                  class="checkbox__input visually-hidden"
                  type="checkbox"
                />
                <span class="checkbox__custom-input"></span>
                <p class="checkbox__label">Remember Password</p>
              </label>
              <a class="login__forgot-link" href="#">Forgot Password?</a>
            </div>
            <button class="login__submit" type="submit">Sign In</button>
          </div>
        </form>
      </div>
      <img
        class="login__cover"
        src="./assets/images/login/bg.webp"
        srcset="assets/images/login/bg.webp 2x"
        alt=""
        width="852"
        height="1011"
        loading="lazy"
      />
    </section>
  </body>
</html>
